# 前端镜像：静态提供工作台，/api/ 原样转发给后端容器。
# 后端只接受本机 Host，所以必须保留浏览器发来的 Host；X-Real-IP 供后端按真实来源限流。
server {
    listen 8787;
    server_tokens off;
    # 宿主机端口可被 Compose 覆盖改映射，重定向只给路径，不拼容器内端口。
    absolute_redirect off;
    root /usr/share/nginx/html;

    # 上传上限与后端一致（128 MB 文件 + 表单开销）。
    client_max_body_size 130m;

    location = / {
        return 303 /demo/;
    }
    location = /demo/app {
        return 301 /demo/app/;
    }

    # 带内容哈希的构建产物可以永久缓存；入口 HTML 与其余静态资源每次取最新。
    location /demo/app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /demo/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/index.html =404;
    }

    location /api/ {
        # 经 Docker 内置 DNS 按需解析：后端容器重建换了地址也无需重启前端。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8787;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 积分、通知与项目进度使用 SSE 长连接；上传直接流式转发。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端容器自身的健康检查，不依赖后端。
    location = /frontend-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
